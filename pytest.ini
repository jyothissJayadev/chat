[pytest]
asyncio_mode = auto
# The Neo4j driver (tests/conftest.py::init_test_db) is created once,
# session-scoped, since establishing it per-test would be wasteful — but
# pytest-asyncio's default gives every test function its own event loop, and
# a driver's connections created in one loop break when awaited from another
# (surfaces as an AttributeError deep in asyncio's proactor transport on
# Windows). Pinning both scopes to "session" keeps one event loop for the
# whole run, matching the driver's own lifetime.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
