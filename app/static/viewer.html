<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Session Debug Viewer</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, Segoe UI, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    flex: 0 0 auto;
    padding: 12px 16px 0;
  }
  .session-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  input {
    flex: 1;
    min-width: 220px;
    padding: 8px 10px;
    background: #1a1d24;
    border: 1px solid #333;
    color: #e6e6e6;
    border-radius: 6px;
  }
  button {
    padding: 8px 14px;
    background: #2b6cb0;
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
  }
  button.secondary { background: #333; }
  label { font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .status { font-size: 13px; color: #999; margin-left: auto; }
  .tabs {
    display: flex;
    gap: 4px;
  }
  .tab-link {
    padding: 8px 16px;
    border-radius: 6px 6px 0 0;
    color: #999;
    text-decoration: none;
    font-size: 13px;
    cursor: pointer;
    background: #1a1d24;
    border: 1px solid #262a33;
    border-bottom: none;
  }
  .tab-link.active {
    color: #e6e6e6;
    background: #171a21;
  }
  .composer {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: #12141a;
    border-top: 1px solid #262a33;
    border-bottom: 1px solid #262a33;
  }
  .composer input { flex: 1; }
  .content {
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 16px 16px;
  }
  .view {
    display: none;
    height: 100%;
    padding-top: 12px;
  }
  .view.active { display: flex; flex-direction: column; }
  .panel {
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 8px;
    padding: 12px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }
  .panel h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8ab4f8;
    margin: 0 0 10px;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #21242c;
    font-size: 13px;
  }
  .field-row.missing { color: #555; font-style: italic; }
  .field-row .val { color: #d7d7d7; max-width: 60%; text-align: right; word-break: break-word; }

  .trace-card {
    border: 1px solid #262a33;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: #12141a;
  }
  .trace-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12.5px;
  }
  .trace-card-header .node-name { font-weight: 600; color: #e6e6e6; }
  .trace-card-header .action { color: #999; flex: 1; min-width: 120px; }
  .trace-card-header .duration { color: #777; font-size: 11px; }
  .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .badge.model { background: rgba(138, 180, 248, 0.15); color: #8ab4f8; }
  .badge.rule { background: rgba(255, 255, 255, 0.06); color: #888; }
  .trace-section { margin-top: 6px; font-size: 12px; }
  .trace-section summary {
    cursor: pointer;
    color: #8ab4f8;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 0;
  }
  .trace-section-body { padding-top: 4px; }
  .prompt-block {
    margin: 4px 0;
    padding: 6px 8px;
    background: #0d0f13;
    border-radius: 6px;
    border: 1px solid #20232b;
  }
  .prompt-role { font-size: 10px; color: #7ee0a8; margin-bottom: 4px; letter-spacing: 0.05em; }
  .trace-section pre, .rule-io pre {
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
    font-family: inherit;
    font-size: 11.5px;
    color: #ccc;
  }
  .rule-io { padding-top: 4px; }
  .rule-io .io { color: #999; font-size: 12px; margin-top: 2px; }

  .msg { margin-bottom: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
  .msg.user { background: #1e2530; margin-left: 20px; }
  .msg.assistant { background: #202417; margin-right: 20px; }
  .msg .role { font-size: 10px; text-transform: uppercase; color: #888; margin-bottom: 3px; }
  .empty { color: #555; font-size: 13px; font-style: italic; }
  .msg.pending { opacity: 0.7; }
  /* app.llm.generate_turn_reply's changes_summary/context_summary — markdown
     tables that accompany `reply` for the same turn (see Message.context_summary/
     changes_summary), rendered as-is rather than parsed into an HTML table:
     they're small, already pipe-aligned, and this avoids pulling in a
     markdown dependency for a dev viewer. */
  .msg-summary { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2c3325; }
  .msg-summary-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: #7ee0a8;
    margin-bottom: 4px;
  }
  .msg-summary pre {
    white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit;
    font-size: 12px; color: #ccc;
  }
  /* Clarifying-question options (app.chat's operation_questions SSE event —
     see app.graph._generate_operation_questions). Renders the LLM-provided
     fixed option buttons; no free-text input (the "allow_custom" affordance
     the event also carries) — deliberately deferred, buttons-only for now. */
  .op-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .op-option-btn {
    padding: 5px 10px;
    background: #263042;
    border: 1px solid #37455c;
    color: #cfe0ff;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .op-option-btn:hover:not(:disabled) { background: #31405a; }
  .op-option-btn:disabled { opacity: 0.5; cursor: default; }
  .op-option-btn.chosen { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
  /* A lone option is the Room Resolution Agent's confident pick (rule 15 —
     see app.llm.RoomResolutionItem's docstring): style it as "recommended"
     rather than one plain choice among several. Multiple options get no
     ranking since the backend sends none — they render as equal choices. */
  .op-option-btn.recommended { background: #1f5c3a; border-color: #2f8f5c; color: #d7ffe9; }
  .op-option-btn.recommended:hover:not(:disabled) { background: #256e46; }
  /* A bundled multi-room option (opt.room_ids set, 2+ rooms — see
     app.llm.RoomResolutionOption's multi-room rule): dashed border marks it
     as "applies to several rooms at once" rather than one specific room. */
  .op-option-btn.bundle { border-style: dashed; }
  /* One batch = one operation_questions SSE event's whole question list —
     answered locally (picking/re-picking an option per question just
     toggles .chosen, nothing sent) until the single submit button below
     fires ONE combined operation_answers reply for the whole batch. */
  .op-batch-progress { font-size: 12px; color: #999; margin: 8px 4px 4px; }
  .op-batch-submit { margin: 4px; }
  .op-batch-submit:disabled { opacity: 0.5; cursor: default; background: #333; }
  .graph-panel {
    display: flex;
    flex-direction: column;
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 8px;
    padding: 12px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .graph-panel .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
    flex: 0 0 auto;
  }
  .graph-panel h2 { margin: 0; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: #999; flex-wrap: wrap; }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  #graphCanvas {
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: block;
    background: #0d0f13;
    border-radius: 6px;
    cursor: grab;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="session-row">
    <input id="sessionId" placeholder="Paste session_id, or leave blank to start a new one..." />
    <button id="loadBtn">Load</button>
    <button id="refreshBtn" class="secondary">Refresh</button>
    <button id="newSessionBtn" class="secondary">New Session</button>
    <label><input type="checkbox" id="autoRefresh" /> Auto (3s)</label>
    <span class="status" id="status"></span>
  </div>
  <nav class="tabs">
    <a href="#/context" class="tab-link" data-route="context">Context</a>
    <a href="#/trace" class="tab-link" data-route="trace">Process Trace</a>
    <a href="#/conversation" class="tab-link" data-route="conversation">Conversation</a>
    <a href="#/graph" class="tab-link" data-route="graph">Knowledge Graph</a>
  </nav>
</div>

<div class="composer">
  <input id="chatInput" placeholder="Type a message and press Enter..." />
  <button id="sendBtn">Send</button>
</div>

<main class="content">
  <section id="section-context" class="view">
    <div class="panel">
      <h2>Context</h2>
      <div id="contextPanel"><div class="empty">No session loaded</div></div>
    </div>
  </section>

  <section id="section-trace" class="view">
    <div class="panel">
      <h2>Process Trace</h2>
      <div id="tracePanel"><div class="empty">No session loaded</div></div>
    </div>
  </section>

  <section id="section-conversation" class="view">
    <div class="panel">
      <h2>Conversation</h2>
      <div id="conversationPanel"><div class="empty">No session loaded</div></div>
    </div>
  </section>

  <section id="section-graph" class="view">
    <div class="graph-panel">
      <div class="panel-header">
        <h2>Knowledge Graph</h2>
        <div style="display:flex; gap:12px; align-items:center;">
          <div class="legend" id="graphLegend"></div>
          <div style="display:flex; gap:6px; align-items:center;">
            <button id="zoomOutBtn" class="secondary" title="Zoom out">−</button>
            <span id="zoomLabel" class="status" style="min-width:44px; text-align:center;">100%</span>
            <button id="zoomInBtn" class="secondary" title="Zoom in">+</button>
            <button id="resetZoomBtn" class="secondary" title="Reset zoom and pan">Fit</button>
            <button id="resetLayoutBtn" class="secondary">Reset Layout</button>
          </div>
        </div>
      </div>
      <canvas id="graphCanvas"></canvas>
    </div>
  </section>
</main>

<script>
let pollTimer = null;

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

const ROUTES = ['context', 'trace', 'conversation', 'graph'];

function currentRoute() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  return ROUTES.includes(hash) ? hash : 'conversation';
}

function renderRoute() {
  const route = currentRoute();
  ROUTES.forEach((r) => {
    document.getElementById('section-' + r).classList.toggle('active', r === route);
    document.querySelector(`.tab-link[data-route="${r}"]`).classList.toggle('active', r === route);
  });
  if (route === 'graph' && resizeGraphCanvasFn) {
    resizeGraphCanvasFn();
  }
}

function renderField(el, key, val) {
  const row = document.createElement('div');
  row.className = 'field-row' + (val === null || val === undefined ? ' missing' : '');
  const display = val === null || val === undefined ? 'missing' : escapeHtml(String(val));
  row.innerHTML = `<span>${escapeHtml(key)}</span><span class="val">${display}</span>`;
  el.appendChild(row);
}

function renderSectionHeading(el, text) {
  const h = document.createElement('div');
  h.style.cssText = 'font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #6b7280; margin: 12px 0 4px;';
  h.textContent = text;
  el.appendChild(h);
}

// nodes: the flat KnowledgeNode list from GET /sessions/{id}/state
// ("knowledge_nodes") — see app/routes.py. session: the same response, for
// its current_field/skipped_rooms/pending_gap/pending_confirmation fields.
function renderContext(nodes, session) {
  const el = document.getElementById('contextPanel');
  el.innerHTML = '';

  if (!nodes || !nodes.length) {
    el.innerHTML = '<div class="empty">No context yet</div>';
    return;
  }

  const byPath = {};
  nodes.forEach((n) => { byPath[n.canonical_path] = n; });
  const valueAt = (path) => (byPath[path] ? byPath[path].value : null);

  renderSectionHeading(el, 'Project');
  renderField(el, 'project type', valueAt('Project.BasicInformation.ProjectType'));
  renderField(el, 'overall budget', valueAt('Project.Budget.Total'));
  renderField(el, 'timeline', valueAt('Project.Timeline.Value'));

  renderSectionHeading(el, 'Rooms');
  const rooms = nodes.filter((n) => n.node_type === 'Rooms' && n.canonical_path !== 'Project.Rooms');
  if (!rooms.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No rooms yet';
    el.appendChild(empty);
  } else {
    rooms.forEach((room, i) => {
      const roomId = room.canonical_path.split('.').pop();
      const prefix = room.canonical_path;
      const isActive = roomId === (session.current_field && session.current_field.room_id);
      const isSkipped = (session.skipped_rooms || []).includes(roomId);
      const roomType = valueAt(`${prefix}.RoomType`);
      const roomHeading = document.createElement('div');
      roomHeading.style.cssText = 'font-weight: 600; color: #d7d7d7; margin: 10px 0 2px; font-size: 13px;';
      roomHeading.textContent = (roomType || `Room ${i + 1}`) + (isActive ? ' (asking)' : '') + (isSkipped ? ' (skipped)' : '');
      el.appendChild(roomHeading);

      renderField(el, 'room type', roomType);
      renderField(el, 'budget', valueAt(`${prefix}.Budget`));
      renderField(el, 'style', valueAt(`${prefix}.Style`));
      renderField(el, 'square footage', valueAt(`${prefix}.SquareFootage`));
      renderField(el, 'existing furniture', valueAt(`${prefix}.ExistingFurniture`));
      renderMaterialsForRoom(el, byPath, nodes, prefix);
      renderFreeformBucket(el, byPath, nodes, `${prefix}.Furniture`, 'furniture');
      renderFreeformBucket(el, byPath, nodes, `${prefix}.Attributes`, 'other details');
    });
  }

  renderSectionHeading(el, 'Requirements');
  renderFreeformBucket(el, byPath, nodes, 'Project.Requirements.ClientPreferences', 'preferences');
  renderFreeformBucket(el, byPath, nodes, 'Project.Requirements.Constraints', 'constraints');

  // Provenance replaces the old confirmed/assumed/skipped field_status
  // breakdown — see app/models.py::ChangedBy (Phase 8/12): which values
  // came directly from the client vs. were inferred vs. calculated.
  renderSectionHeading(el, 'Provenance');
  const counts = { user_message: 0, inferred: 0, system_default: 0 };
  nodes.forEach((n) => {
    if (n.value !== null && n.value !== undefined && Object.prototype.hasOwnProperty.call(counts, n.changed_by)) {
      counts[n.changed_by]++;
    }
  });
  renderField(el, 'stated by client', counts.user_message);
  renderField(el, 'inferred', counts.inferred);
  renderField(el, 'calculated', counts.system_default);
}

function renderMaterialsForRoom(el, byPath, nodes, roomPrefix) {
  const materialsPrefix = `${roomPrefix}.Materials.`;
  const itemSlugs = [...new Set(
    nodes
      .filter((n) => n.canonical_path.startsWith(materialsPrefix))
      .map((n) => n.canonical_path.slice(materialsPrefix.length).split('.')[0])
  )];

  const header = document.createElement('div');
  const isEmpty = itemSlugs.length === 0;
  header.className = 'field-row' + (isEmpty ? ' missing' : '');
  header.innerHTML = `<span>materials</span><span class="val">${isEmpty ? 'missing' : `${itemSlugs.length} item${itemSlugs.length === 1 ? '' : 's'}`}</span>`;
  el.appendChild(header);
  if (isEmpty) return;

  const list = document.createElement('div');
  list.style.cssText = 'padding: 2px 0 10px 12px; font-size: 12px; color: #aaa;';
  list.innerHTML = itemSlugs
    .map((slug) => {
      const item = byPath[`${materialsPrefix}${slug}.Label`];
      const material = byPath[`${materialsPrefix}${slug}.Material`];
      const spec = byPath[`${materialsPrefix}${slug}.Specification`];
      const itemLabel = item ? String(item.value) : slug;
      const materialLabel = material ? String(material.value) : '?';
      const specText = spec && spec.value ? ` <span style="color:#777">(${escapeHtml(String(spec.value))})</span>` : '';
      return `<div style="padding:3px 0;">${escapeHtml(itemLabel)}: ${escapeHtml(materialLabel)}${specText}</div>`;
    })
    .join('');
  el.appendChild(list);
}

// Renders a freeform "fact bucket" (Furniture/Attributes/ClientPreferences/
// Constraints — see ontology/v1.yaml) as a list of its instances' Label
// values, same shape as renderMaterialsForRoom above.
function renderFreeformBucket(el, byPath, nodes, containerPath, label) {
  const prefix = containerPath + '.';
  const instanceSlugs = [...new Set(
    nodes
      .filter((n) => n.canonical_path.startsWith(prefix))
      .map((n) => n.canonical_path.slice(prefix.length).split('.')[0])
  )];

  const header = document.createElement('div');
  const isEmpty = instanceSlugs.length === 0;
  header.className = 'field-row' + (isEmpty ? ' missing' : '');
  header.innerHTML = `<span>${escapeHtml(label)}</span><span class="val">${isEmpty ? 'none noted' : `${instanceSlugs.length} noted`}</span>`;
  el.appendChild(header);
  if (isEmpty) return;

  const list = document.createElement('div');
  list.style.cssText = 'padding: 2px 0 10px 12px; font-size: 12px; color: #aaa;';
  list.innerHTML = instanceSlugs
    .map((slug) => {
      const labelNode = byPath[`${prefix}${slug}.Label`];
      return `<div style="padding:3px 0;">${escapeHtml(labelNode ? String(labelNode.value) : slug)}</div>`;
    })
    .join('');
  el.appendChild(list);
}

function renderTraceEntry(t) {
  const card = document.createElement('div');
  card.className = 'trace-card';

  const header = document.createElement('div');
  header.className = 'trace-card-header';
  const isLlm = !!(t.llm_input || t.llm_output);
  const badgeClass = t.model_used ? 'badge model' : 'badge rule';
  const badgeText = t.model_used || 'rule-based';
  header.innerHTML = `
    <span class="node-name">${escapeHtml(t.node_name)}</span>
    <span class="action">${escapeHtml(t.output_summary)}</span>
    <span class="duration">${t.duration_ms}ms</span>
    <span class="${badgeClass}">${escapeHtml(badgeText)}</span>
  `;
  card.appendChild(header);

  if (isLlm) {
    if (t.llm_input) {
      const details = document.createElement('details');
      details.className = 'trace-section';
      details.open = false;
      const summary = document.createElement('summary');
      summary.textContent = 'LLM Input';
      details.appendChild(summary);
      const body = document.createElement('div');
      body.className = 'trace-section-body';
      t.llm_input.forEach((m) => {
        const block = document.createElement('div');
        block.className = 'prompt-block';
        const roleLabel = document.createElement('div');
        roleLabel.className = 'prompt-role';
        roleLabel.textContent = (m.role || '').toUpperCase();
        const pre = document.createElement('pre');
        pre.textContent = typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2);
        block.appendChild(roleLabel);
        block.appendChild(pre);
        body.appendChild(block);
      });
      details.appendChild(body);
      card.appendChild(details);
    }
    if (t.llm_output) {
      const details = document.createElement('details');
      details.className = 'trace-section';
      details.open = false;
      const summary = document.createElement('summary');
      summary.textContent = 'LLM Output';
      details.appendChild(summary);
      const body = document.createElement('div');
      body.className = 'trace-section-body';
      const pre = document.createElement('pre');
      pre.textContent = t.llm_output;
      body.appendChild(pre);
      details.appendChild(body);
      card.appendChild(details);
    }
  } else {
    const body = document.createElement('div');
    body.className = 'rule-io';
    const inputLine = document.createElement('div');
    inputLine.className = 'io';
    inputLine.textContent = 'input: ' + t.input_summary;
    const outputLine = document.createElement('div');
    outputLine.className = 'io';
    outputLine.textContent = 'output: ' + t.output_summary;
    body.appendChild(inputLine);
    body.appendChild(outputLine);
    card.appendChild(body);
  }

  return card;
}

function renderTrace(trace) {
  const el = document.getElementById('tracePanel');
  if (!trace.length) { el.innerHTML = '<div class="empty">No trace entries yet</div>'; return; }
  el.innerHTML = '';
  trace.forEach((t) => el.appendChild(renderTraceEntry(t)));
}

function renderConversation(messages) {
  const el = document.getElementById('conversationPanel');
  if (!messages.length) { el.innerHTML = '<div class="empty">No messages yet</div>'; return; }
  el.innerHTML = '';
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;
    div.innerHTML = `<div class="role">${m.role}</div><div>${escapeHtml(m.content)}</div>`;
    appendSummaryBlocks(div, m.context_summary, m.changes_summary);
    el.appendChild(div);
  });
  el.scrollTop = el.scrollHeight;
}

// Node color now reflects the tree structure + provenance
// (app.models.ChangedBy) rather than the old ContextGraph GraphNodeType —
// there's no separate freeform "graph" anymore, this IS the knowledge tree,
// so "room" (a Rooms instance container), "container" (any other structural
// node with no value of its own — Project, BasicInformation, Materials,
// ...), and then the three provenance colors for actual leaf values.
const NODE_COLORS = {
  room: '#8ab4f8',
  container: '#5b6472',
  stated: '#7ee0a8',
  inferred: '#c58af9',
  calculated: '#f7c948',
};

function graphNodeType(n) {
  if (n.value === null || n.value === undefined) {
    return n.node_type === 'Rooms' ? 'room' : 'container';
  }
  if (n.changed_by === 'inferred') return 'inferred';
  if (n.changed_by === 'system_default') return 'calculated';
  return 'stated';
}

// Builds the {nodes, edges} shape drawGraph()/updateGraphData() expect from
// the flat KnowledgeNode list — edges are just parent_id -> node_id (the
// tree structure itself; there's no separate relation graph until
// app/dependency_graph.py's KnowledgeEdge gets a live writer).
function buildGraphFromNodes(nodes) {
  const list = nodes || [];
  const gNodes = list.map((n) => ({
    id: n.node_id,
    label: n.value !== null && n.value !== undefined
      ? `${n.canonical_path.split('.').pop()}: ${n.value}`
      : n.canonical_path.split('.').pop(),
    type: graphNodeType(n),
  }));
  const gEdges = list
    .filter((n) => n.parent_id)
    .map((n) => ({ source: n.parent_id, target: n.node_id, relation: 'part_of' }));
  return { nodes: gNodes, edges: gEdges };
}

const graphLayout = new Map(); // id -> {x, y, vx, vy, pinned}
let graphNodes = [];
let graphEdges = [];
let draggingNodeId = null;
let panning = false;
let lastPan = null;
let graphCanvas = null;
let graphCtx = null;
let resizeGraphCanvasFn = null;

function renderLegend() {
  const el = document.getElementById('graphLegend');
  el.innerHTML = Object.entries(NODE_COLORS)
    .map(([type, color]) => `<span><span class="dot" style="background:${color}"></span>${type}</span>`)
    .join('');
}

function canvasPoint(e) {
  const rect = graphCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function findNodeAt(x, y) {
  const rect = graphCanvas.getBoundingClientRect();
  const hitR = Math.max(8, 14 * graphScale * graphZoom);
  for (const n of graphNodes) {
    const p = graphLayout.get(n.id);
    if (!p) continue;
    const s = layoutToScreen(rect, p.x, p.y);
    const dx = s.x - x, dy = s.y - y;
    if (dx * dx + dy * dy <= hitR * hitR) return n;
  }
  return null;
}

function initGraphCanvas() {
  graphCanvas = document.getElementById('graphCanvas');
  graphCtx = graphCanvas.getContext('2d');

  const resize = () => {
    const rect = graphCanvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    graphCanvas.width = rect.width * dpr;
    graphCanvas.height = rect.height * dpr;
    graphCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  window.addEventListener('resize', resize);
  resizeGraphCanvasFn = resize;

  graphCanvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = graphCanvas.getBoundingClientRect();
    const pt = canvasPoint(e);
    zoomAt(pt.x, pt.y, e.deltaY < 0 ? 1.15 : 1 / 1.15, rect);
  }, { passive: false });

  graphCanvas.addEventListener('mousedown', (e) => {
    const { x, y } = canvasPoint(e);
    const hit = findNodeAt(x, y);
    if (hit) {
      draggingNodeId = hit.id;
      graphCanvas.style.cursor = 'grabbing';
    } else {
      panning = true;
      lastPan = { x, y };
      graphCanvas.style.cursor = 'move';
    }
  });
  graphCanvas.addEventListener('mousemove', (e) => {
    const { x, y } = canvasPoint(e);
    if (draggingNodeId) {
      const rect = graphCanvas.getBoundingClientRect();
      const p = graphLayout.get(draggingNodeId);
      if (p) {
        const l = screenToLayout(rect, x, y);
        p.x = l.x; p.y = l.y;
        p.vx = 0; p.vy = 0;
      }
    } else if (panning && lastPan) {
      graphPanX += x - lastPan.x;
      graphPanY += y - lastPan.y;
      lastPan = { x, y };
    }
  });
  window.addEventListener('mouseup', () => {
    if (draggingNodeId) {
      const p = graphLayout.get(draggingNodeId);
      if (p) p.pinned = true;
    }
    draggingNodeId = null;
    panning = false;
    lastPan = null;
    graphCanvas.style.cursor = 'grab';
  });
}

// The knowledge tree is a real tree (every node has at most one CHILD_OF
// parent — see app/graph_store.py), so the old force-directed physics is the
// wrong tool: it scatters nodes, overlaps labels and crosses edges no matter
// how the constants are tuned. Layout is now a deterministic tidy-tree pass:
// each subtree gets a contiguous horizontal band sized from its widest label,
// children sit in a row beneath their parent, and the result is scaled to fit
// the canvas so every node is always fully visible.
const TREE_H_GAP = 36;   // gap between sibling subtrees
const TREE_ROW_H = 56;   // vertical gap between depth levels
const TREE_PAD = 30;     // canvas padding around the whole drawing
let graphScale = 1;      // uniform scale applied to fit the tree on the canvas
const MIN_ZOOM = 0.2;
const MAX_ZOOM = 8;
let graphZoom = 1;       // user zoom multiplier on top of the fit scale
let graphPanX = 0;       // camera pan (CSS px)
let graphPanY = 0;

function graphCenter(rect) {
  return { x: rect.width / 2, y: rect.height / 2 };
}

// Camera transform: the tree is laid out in fit-to-canvas coordinates
// (graphScale baked in); graphZoom/graphPan let the user inspect a portion
// closely. Both are uniform, so overlap-free labels stay overlap-free.
function layoutToScreen(rect, x, y) {
  const c = graphCenter(rect);
  return { x: c.x + (x - c.x) * graphZoom + graphPanX, y: c.y + (y - c.y) * graphZoom + graphPanY };
}

function screenToLayout(rect, x, y) {
  const c = graphCenter(rect);
  return { x: c.x + (x - c.x - graphPanX) / graphZoom, y: c.y + (y - c.y - graphPanY) / graphZoom };
}

// Zooms about the point (sx, sy) in screen space, keeping whatever node is
// under the cursor pinned under it — so a zoom follows the mouse, not the
// canvas center.
function zoomAt(sx, sy, factor, rect) {
  const c = graphCenter(rect);
  const l = screenToLayout(rect, sx, sy);
  graphZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, graphZoom * factor));
  graphPanX = sx - c.x - (l.x - c.x) * graphZoom;
  graphPanY = sy - c.y - (l.y - c.y) * graphZoom;
  updateZoomUI();
}

function updateZoomUI() {
  const el = document.getElementById('zoomLabel');
  if (el) el.textContent = Math.round(graphZoom * 100) + '%';
}

function computeTreeLayout(nodes, edges) {
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const children = new Map();
  const parentOf = new Map();
  for (const n of nodes) children.set(n.id, []);
  for (const e of edges) {
    if (children.has(e.source) && children.has(e.target)) {
      children.get(e.source).push(e.target);
      parentOf.set(e.target, e.source);
    }
  }
  const roots = nodes.filter((n) => !parentOf.has(n.id)).map((n) => n.id);

  // Each subtree reports how far it reaches LEFT and RIGHT of its root's
  // centerline. Labels draw only to the right of the circle, so right reach
  // is driven by the widest label in the subtree; left reach just needs
  // circle clearance. Sibling bands are laid end-to-end with a fixed gap, so
  // no two labels can ever overlap.
  const reach = new Map();
  const measure = (id) => {
    if (reach.has(id)) return reach.get(id);
    const kids = children.get(id) || [];
    const ownLeft = 15;
    const ownRight = 12 + (byId.get(id).labelWidth || 0);
    let left = ownLeft, right = ownRight;
    if (kids.length) {
      const widths = kids.map((k) => { const r = measure(k); return r.left + r.right; });
      const total = widths.reduce((s, w) => s + w, 0) + TREE_H_GAP * (kids.length - 1);
      const half = total / 2;
      left = Math.max(ownLeft, half);
      right = Math.max(ownRight, half);
    }
    reach.set(id, { left, right });
    return { left, right };
  };
  roots.forEach(measure);

  const pos = new Map();
  const place = (id, x, y) => {
    pos.set(id, { x, y });
    const kids = children.get(id) || [];
    if (!kids.length) return;
    const total = kids.reduce((s, k) => { const r = reach.get(k); return s + r.left + r.right; }, 0) + TREE_H_GAP * (kids.length - 1);
    let cx = x - total / 2;
    for (const k of kids) {
      const r = reach.get(k);
      place(k, cx + r.left, y + TREE_ROW_H);
      cx += r.left + r.right + TREE_H_GAP;
    }
  };
  roots.forEach((r) => place(r, 0, 0));
  return { pos, reach };
}

function fitPositionsToCanvas(pos, reach, w, h) {
  if (!pos.size || w <= 0 || h <= 0) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [id, p] of pos) {
    const r = reach.get(id) || { left: 15, right: 15 };
    const left = p.x - r.left, right = p.x + r.right;
    if (left < minX) minX = left;
    if (right > maxX) maxX = right;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  const spanX = Math.max(1, maxX - minX);
  const spanY = Math.max(1, maxY - minY);
  const scale = Math.min((w - TREE_PAD * 2) / (spanX + 40), (h - TREE_PAD * 2) / (spanY + 40), 1);
  graphScale = scale;
  const offX = (w - spanX * scale) / 2 - minX * scale;
  const offY = (h - spanY * scale) / 2 - minY * scale;
  for (const p of pos.values()) {
    p.x = p.x * scale + offX;
    p.y = p.y * scale + offY;
  }
}

function updateGraphData(nodes, edges) {
  graphNodes = nodes || [];
  graphEdges = edges || [];
  // loadSession() can resolve before the graph tab's own resize() has taken
  // effect (e.g. the very first load, where initGraphCanvas() measures the
  // canvas while its section is still display:none). Re-resize here so the
  // tree is never laid out around a stale 0x0 rect.
  if (resizeGraphCanvasFn) resizeGraphCanvasFn();
  const rect = graphCanvas.getBoundingClientRect();
  const seen = new Set(graphNodes.map((n) => n.id));

  // Measure each label once (labels render to the right of the node circle)
  // so the tree layout can reserve each subtree a band wide enough for its
  // longest label — that's what makes overlapping text impossible.
  graphCtx.font = '11px sans-serif';
  for (const n of graphNodes) {
    n.labelWidth = graphCtx.measureText(n.label).width;
  }

  const { pos, reach } = computeTreeLayout(graphNodes, graphEdges);
  fitPositionsToCanvas(pos, reach, rect.width, rect.height);

  for (const n of graphNodes) {
    const existing = graphLayout.get(n.id);
    const t = pos.get(n.id);
    if (existing && existing.pinned) continue; // keep nodes the user dragged
    graphLayout.set(n.id, t || { x: rect.width / 2, y: rect.height / 2, vx: 0, vy: 0, pinned: false });
  }
  for (const id of [...graphLayout.keys()]) {
    if (!seen.has(id)) graphLayout.delete(id);
  }
}

function resetGraphLayout() {
  graphZoom = 1;
  graphPanX = 0;
  graphPanY = 0;
  updateZoomUI();
  graphLayout.clear();
  updateGraphData(graphNodes, graphEdges);
}

function drawGraph() {
  if (!graphCtx) return;
  const rect = graphCanvas.getBoundingClientRect();
  graphCtx.clearRect(0, 0, rect.width, rect.height);

  if (!graphNodes.length) {
    graphCtx.fillStyle = '#555';
    graphCtx.font = '13px sans-serif';
    graphCtx.fillText('No graph nodes yet', 16, 24);
    return;
  }

  const fontScale = graphScale * graphZoom;

  graphCtx.strokeStyle = '#3a3f4b';
  graphCtx.fillStyle = '#8a8f99';
  graphCtx.font = `${Math.max(5, 10 * fontScale)}px sans-serif`;
  for (const e of graphEdges) {
    const a = graphLayout.get(e.source), b = graphLayout.get(e.target);
    if (!a || !b) continue;
    const sa = layoutToScreen(rect, a.x, a.y);
    const sb = layoutToScreen(rect, b.x, b.y);
    graphCtx.beginPath();
    graphCtx.moveTo(sa.x, sa.y);
    graphCtx.lineTo(sb.x, sb.y);
    graphCtx.stroke();
    graphCtx.fillText(e.relation, (sa.x + sb.x) / 2, (sa.y + sb.y) / 2);
  }

  const radius = Math.max(4, 9 * fontScale);
  const labelFont = Math.max(5, 11 * fontScale);
  for (const n of graphNodes) {
    const p = graphLayout.get(n.id);
    if (!p) continue;
    const s = layoutToScreen(rect, p.x, p.y);
    graphCtx.beginPath();
    graphCtx.arc(s.x, s.y, radius, 0, Math.PI * 2);
    graphCtx.fillStyle = NODE_COLORS[n.type] || NODE_COLORS.container;
    graphCtx.fill();
    graphCtx.strokeStyle = p.pinned ? '#fff' : '#111';
    graphCtx.lineWidth = p.pinned ? 2 : 1;
    graphCtx.stroke();

    graphCtx.fillStyle = '#e6e6e6';
    graphCtx.font = `${labelFont}px sans-serif`;
    // Labels normally sit to the right of the node, but that runs off-canvas
    // for nodes pushed toward the right wall — flip to the left there so the
    // text stays fully visible instead of getting clipped at the edge. Widths
    // are scaled by fontScale to match the drawn font.
    const labelWidth = (n.labelWidth || 0) * fontScale;
    const labelX = s.x + 12 * fontScale + labelWidth > rect.width ? s.x - 12 * fontScale - labelWidth : s.x + 12 * fontScale;
    graphCtx.fillText(n.label, labelX, s.y + 4 * fontScale);
  }
}

function graphLoop() {
  drawGraph();
  requestAnimationFrame(graphLoop);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

async function loadSession() {
  const id = document.getElementById('sessionId').value.trim();
  if (!id) return;
  setStatus('loading...');
  try {
    const res = await fetch(`/sessions/${encodeURIComponent(id)}/state`);
    if (!res.ok) {
      setStatus(`error: ${res.status}`);
      return;
    }
    const data = await res.json();
    renderContext(data.knowledge_nodes, data);
    liveTrace = data.trace;
    renderTrace(liveTrace);
    // A still-open operation_questions batch (session.status "in_progress"
    // with pending_operation_questions set) has its question text already
    // sitting in session.messages as plain assistant bubbles (app.chat
    // appends q["question"] for each one when it holds the turn). Render
    // those as the interactive MCQ buttons instead of letting
    // renderConversation flatten them to text — otherwise every full
    // /state refetch (this function runs after EVERY turn, see
    // streamChatEvents' finally block) wipes out the buttons
    // renderOperationQuestions just drew live.
    const pending = data.status === 'in_progress' ? data.pending_operation_questions : null;
    const pendingTexts = new Set((pending ? pending.questions : []).map((q) => q.question));
    const messages = pendingTexts.size
      ? data.messages.filter((m) => !(m.role === 'assistant' && pendingTexts.has(m.content)))
      : data.messages;
    renderConversation(messages);
    if (pending) renderOperationQuestions(pending.questions);
    const graph = buildGraphFromNodes(data.knowledge_nodes);
    updateGraphData(graph.nodes, graph.edges);
    setStatus(`status: ${data.status} · last loaded ${new Date().toLocaleTimeString()}`);
  } catch (e) {
    setStatus('error: ' + e.message);
  }
}

function appendLiveMessage(role, content) {
  const el = document.getElementById('conversationPanel');
  if (el.querySelector('.empty')) el.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg ' + role + ' pending';
  div.innerHTML = `<div class="role">${role}</div><div class="content"></div>`;
  div.querySelector('.content').textContent = content;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div;
}

// app.llm.generate_turn_reply's changes_summary/context_summary — the
// per-turn markdown tables that ride alongside `reply` (see
// Message.context_summary/changes_summary, app.chat's pipeline_result
// event). Appended into `msgDiv` (an assistant .msg element, live or
// reloaded) as their own labeled blocks, kept out of the reply bubble's own
// .content so they read as distinct from the conversational text per
// app.prompts.GENERAL_RULES_BLOCK ("Markdown tables ... never inside
// `reply`"). Textual only (no markdown->HTML table parsing) — .textContent
// avoids ever needing to trust/escape LLM-produced table content by hand.
function appendSummaryBlocks(msgDiv, contextSummary, changesSummary) {
  const blocks = [
    ['Context', contextSummary],
    ['Changes', changesSummary],
  ];
  for (const [label, text] of blocks) {
    if (!text) continue;
    const block = document.createElement('div');
    block.className = 'msg-summary';
    block.innerHTML = `<div class="msg-summary-label">${label}</div><pre></pre>`;
    block.querySelector('pre').textContent = text;
    msgDiv.appendChild(block);
  }
}

// Holds this session's trace entries between full /state refetches — appended
// to live as 'trace' SSE events arrive during a send, then wholly replaced by
// the authoritative list once loadSession() runs at the end of the turn.
let liveTrace = [];

// Renders one assistant bubble per clarifying question from an
// operation_questions SSE event (see app.chat.run_chat_turn's docstring and
// app.graph._generate_operation_questions), each question line-up followed
// by a row of buttons — one per LLM-provided option label — plus ONE shared
// progress line ("N of total answered") and ONE shared submit button for
// the whole batch. Clicking an option only updates local state (batch.answers/
// batch.roomSelections below) and re-highlights .chosen — it can be changed
// freely, nothing is sent to the server until submit. The submit button
// stays disabled until every question in the batch has a selection; only
// then does it fire ONE combined operation_answers reply covering the whole
// batch (app.graph.classify_intent_node's resume branch already merges a
// multi-op_id answers dict in one pass, see _merge_resume_answers).
//
// This renders the fixed option buttons the model proposed — no free-text
// input, even though the event's `allow_custom: true` signals the API
// already accepts a typed answer for any op_id (deliberately deferred,
// buttons-only for now). A single-option question is the model's confident
// pick (RoomResolutionItem rule 15, not a real either/or), so it renders
// with the "recommended" style instead of looking like one plain choice.
function renderOperationQuestions(questions) {
  const el = document.getElementById('conversationPanel');
  if (el.querySelector('.empty')) el.innerHTML = '';

  const total = (questions || []).length;
  const batch = { answers: {}, roomSelections: {} }; // op_id -> label / op_id -> room_ids

  const batchDiv = document.createElement('div');
  batchDiv.className = 'op-batch';

  const progress = document.createElement('div');
  progress.className = 'op-batch-progress';

  const submitBtn = document.createElement('button');
  submitBtn.className = 'op-batch-submit';
  submitBtn.textContent = 'Submit answers';
  submitBtn.disabled = true;

  const updateProgress = () => {
    const answered = Object.keys(batch.answers).length;
    progress.textContent = `${answered} of ${total} answered`;
    submitBtn.disabled = answered < total;
  };

  (questions || []).forEach((q) => {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `<div class="role">assistant</div><div class="content"></div>`;
    div.querySelector('.content').textContent = q.question;

    const options = document.createElement('div');
    options.className = 'op-options';
    const recommended = (q.options || []).length === 1;
    (q.options || []).forEach((opt) => {
      const isBundle = Array.isArray(opt.room_ids) && opt.room_ids.length > 1;
      const btn = document.createElement('button');
      btn.className = 'op-option-btn' + (recommended ? ' recommended' : '') + (isBundle ? ' bundle' : '');
      btn.textContent = recommended ? `${opt.label} (recommended)` : opt.label;
      btn.addEventListener('click', () => {
        [...options.querySelectorAll('.op-option-btn')].forEach((b) => b.classList.remove('chosen'));
        btn.classList.add('chosen');
        batch.answers[q.op_id] = opt.label;
        if (isBundle) batch.roomSelections[q.op_id] = opt.room_ids;
        else delete batch.roomSelections[q.op_id];
        updateProgress();
      });
      options.appendChild(btn);
    });
    div.appendChild(options);
    batchDiv.appendChild(div);
  });

  batchDiv.appendChild(progress);
  submitBtn.addEventListener('click', () => submitOperationAnswers(batch, batchDiv));
  batchDiv.appendChild(submitBtn);
  updateProgress();

  el.appendChild(batchDiv);
  el.scrollTop = el.scrollHeight;
}

// Submits every answer collected in a rendered operation_questions batch in
// ONE resume turn — see app.chat.ChatRequest.operation_answers
// ({op_id: chosen_value, ...}, each value an option's own label) and
// operation_room_selections ({op_id: room_ids, ...} for a bundled
// multi-room pick — app.llm.RoomResolutionOption's multi-room rule;
// app.graph.classify_intent_node's resume branch fans that ONE op out into
// one write task per room). message is deliberately empty: the resume path
// reads pending_operation_questions/operation_answers off the session, not
// the message text.
async function submitOperationAnswers(batch, batchDiv) {
  batchDiv.querySelectorAll('button').forEach((b) => (b.disabled = true));

  const sid = document.getElementById('sessionId').value.trim() || null;
  Object.values(batch.answers).forEach((label) => appendLiveMessage('user', label));
  const body = { message: '', operation_answers: batch.answers };
  if (sid) body.session_id = sid;
  if (Object.keys(batch.roomSelections).length) body.operation_room_selections = batch.roomSelections;
  await streamChatEvents(body);
}

// Shared SSE consumption for both a typed message (sendMessage) and a
// clarifying-question batch (submitOperationAnswers) — fetches /chat,
// streams the event-per-line body, and dispatches each event onto the
// conversation/trace panels. See app.chat.run_chat_turn's docstring for the
// full event catalog.
async function streamChatEvents(body) {
  document.getElementById('sendBtn').disabled = true;
  setStatus('sending...');

  // Pending placeholder bubble while the turn runs — nothing streams into it
  // any more (generate_turn_reply produces the whole reply in one shot, not
  // token-by-token), so every branch below just removes it once the real
  // reply/questions/error arrives.
  const liveAssistant = appendLiveMessage('assistant', '');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok || !res.body) {
      setStatus(`error: ${res.status}`);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const evt = JSON.parse(line.slice(5).trim());
        if (evt.type === 'progress') {
          setStatus(`running: ${evt.node}...`);
        } else if (evt.type === 'trace') {
          liveTrace = liveTrace.concat(evt.entries);
          renderTrace(liveTrace);
        } else if (evt.type === 'pipeline_result') {
          // app.pipeline.run_pipeline's single join-step reply — replaces
          // the old separate context_updated/ask_question/confirm_change/
          // wrapup events (see app.chat.run_chat_turn's docstring). reply is
          // either the next question (is_question=true) or a closing/
          // completion line, already folding in any direct answer/database
          // results for this turn (see app.llm.generate_turn_reply).
          // context_summary/changes_summary are this same turn's markdown
          // tables — appended below the reply bubble, not merged into it.
          liveAssistant.remove();
          const replyDiv = appendLiveMessage('assistant', evt.reply);
          appendSummaryBlocks(replyDiv, evt.context_summary, evt.changes_summary);
        } else if (evt.type === 'operation_questions') {
          // classify_intent_node held the whole write batch back — at least
          // one op's graph connection is still null and the model judged
          // the ambiguity real (see app.graph._generate_operation_questions).
          // Nothing writes until every question below is answered.
          liveAssistant.remove();
          renderOperationQuestions(evt.questions);
        } else if (evt.type === 'image_description') {
          appendLiveMessage('assistant', '[image] ' + evt.content);
        } else if (evt.type === 'error') {
          liveAssistant.remove();
          appendLiveMessage('assistant', `[error] ${evt.message}`);
          setStatus(`error: ${evt.message}`);
        } else if (evt.type === 'done') {
          document.getElementById('sessionId').value = evt.session_id;
        }
      }
    }
  } catch (e) {
    setStatus('error: ' + e.message);
  } finally {
    document.getElementById('sendBtn').disabled = false;
    await loadSession();
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;
  input.value = '';

  const sid = document.getElementById('sessionId').value.trim() || null;
  const body = sid ? { session_id: sid, message } : { message };

  appendLiveMessage('user', message);
  await streamChatEvents(body);
}

document.getElementById('loadBtn').addEventListener('click', loadSession);
document.getElementById('refreshBtn').addEventListener('click', loadSession);
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
document.getElementById('resetLayoutBtn').addEventListener('click', resetGraphLayout);
document.getElementById('zoomInBtn').addEventListener('click', () => {
  const rect = graphCanvas.getBoundingClientRect();
  zoomAt(rect.width / 2, rect.height / 2, 1.25, rect);
});
document.getElementById('zoomOutBtn').addEventListener('click', () => {
  const rect = graphCanvas.getBoundingClientRect();
  zoomAt(rect.width / 2, rect.height / 2, 0.8, rect);
});
document.getElementById('resetZoomBtn').addEventListener('click', () => {
  graphZoom = 1;
  graphPanX = 0;
  graphPanY = 0;
  updateZoomUI();
});
document.getElementById('newSessionBtn').addEventListener('click', () => {
  document.getElementById('sessionId').value = '';
  document.getElementById('contextPanel').innerHTML = '<div class="empty">No session loaded</div>';
  liveTrace = [];
  document.getElementById('tracePanel').innerHTML = '<div class="empty">No session loaded</div>';
  document.getElementById('conversationPanel').innerHTML = '<div class="empty">No session loaded</div>';
  graphLayout.clear();
  updateGraphData([], []);
  setStatus('new session ready — send a message to create it');
});
document.getElementById('autoRefresh').addEventListener('change', (e) => {
  if (e.target.checked) {
    pollTimer = setInterval(loadSession, 3000);
  } else if (pollTimer) {
    clearInterval(pollTimer);
  }
});
window.addEventListener('hashchange', renderRoute);

initGraphCanvas();
renderLegend();
requestAnimationFrame(graphLoop);
renderRoute();

const initial = qs('session_id');
if (initial) {
  document.getElementById('sessionId').value = initial;
  loadSession();
}
</script>
</body>
</html>
